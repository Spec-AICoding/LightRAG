[project]
name = "magicbox-backend"
version = "0.1.0"
description = "Magicbox query service: read-only Neo4j graph retrieval for LightRAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[tool.uv]
package = false
